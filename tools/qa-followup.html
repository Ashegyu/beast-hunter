<!doctype html><meta charset="utf-8"><title>Stage B Followup QA</title><style>body{margin:0;background:#17232a;color:#eee;font:13px sans-serif}header{padding:8px}iframe{border:0;margin:8px;display:block}button,select{padding:5px;margin-right:8px}pre{font-size:11px;white-space:pre-wrap}</style><header><label>크기 <select id="size"><option>667x375</option><option>740x360</option><option selected>844x390</option><option>932x430</option></select></label><button id="seed">동일 검증 세이브 시작</button><button id="open">기존 기록 열기</button><button id="inspect">성능·저장 기록</button></header><iframe id="game" title="가로 게임 검증" width="844" height="390"></iframe><pre id="diagnostic"></pre><script type="module">
import * as g from './game-engine.js?v=0.98.0';import {rollItem} from './loot.js?v=0.98.0';
const key='beast-hunter:profile:v1',f=document.querySelector('#game');let seed=239;const rng=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296};function open(){f.src='index.html?qa='+Date.now()}
document.querySelector('#size').onchange=()=>{const[w,h]=document.querySelector('#size').value.split('x');f.width=w;f.height=h};document.querySelector('#open').onclick=open;
document.querySelector('#seed').onclick=()=>{const p=g.createProfile();p.level=35;p.gold=10000000;p.cores=300;p.clearedStage=p.unlockedStage=3;p.stageProgress=[10,10,10];p.bossMastery=[2,2,2];p.difficultyProgress=[[10,10,10],[10,10,10]];p.forge.blade=5;p.forge.armor=2;p.skills.edge=p.skills.haste=2;p.skillBook=g.restoreSkillBook(null,35);for(const m of g.MATERIALS)p.materials[m.id]=10000;seed=239;let id=1;for(const pos of g.EQUIPMENT_KEYS){const item=rollItem({id:id++,tier:1,slot:g.itemSlotForPosition(pos),quality:0},rng);p.inventory.push(item);p.equipment[pos]=item.id;}const state=g.createGame(p);for(const[n,runes]of [['대군',['chain','explosion','fury']],['보스',['bleed','shred','execution']],['생존',['leech','counter','shred']]].entries()){for(let j=0;j<3;j++){const pos=['weapon','helmet','armor'][j],item=n===0?p.inventory.find(i=>i.id===p.equipment[pos]):rollItem({id:id++,tier:1,slot:pos,quality:0},rng);if(n)p.inventory.push(item);p.equipment[pos]=item.id;item.inscription=runes[1][j];}g.saveBuild(state,n,runes[0]);}p.nextItemId=id;g.applyBuild(state,0);localStorage.setItem(key,g.encodeProfile(p));open()};
document.querySelector('#inspect').onclick=()=>{const shell=f.contentDocument?.querySelector('#game-shell'),p=JSON.parse(localStorage.getItem(key)||'{}');document.querySelector('#diagnostic').textContent=JSON.stringify({view:shell?.dataset,version:p.version,gold:p.gold,items:p.inventory?.length,selectedBuild:p.selectedBuild,settled:p.settledBattleIds,activeBattle:p.activeBattle},null,2)};
</script>
