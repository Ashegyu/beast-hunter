<!doctype html><meta charset="utf-8"><title>Codex layout QA</title><style>body{margin:0;background:#222;color:#eee;font:12px sans-serif}header{height:32px;padding:6px}iframe{display:block;border:0;margin:8px}button,select{padding:4px}</style><header><select id="size" aria-label="검증 크기"><option>667x375</option><option>740x360</option><option selected>844x390</option><option>932x430</option></select><button id="seed">도감 검증 세이브</button></header><iframe id="game" title="도감 검증" width="844" height="390"></iframe><script type="module">
import * as g from './game-engine.js?v=0.99.0';const f=document.querySelector('#game');document.querySelector('#size').onchange=()=>{const[w,h]=document.querySelector('#size').value.split('x');f.width=w;f.height=h};document.querySelector('#seed').onclick=()=>{const p=g.createProfile();p.level=35;p.gold=21994;p.cores=133;p.skillBook=g.restoreSkillBook(null,35);p.unlockedStage=3;p.stageProgress=[10,10,10];p.clearedStage=3;p.inventory=g.ITEM_CATALOG.slice(0,24).map((r,n)=>({...r,id:n+1,catalogId:r.id,rarity:n%7,affixes:{...r.base},rollVersion:1,enhancement:0}));p.nextItemId=25;for(const k of ['weapon','armor','charm']){const r=p.inventory.find(i=>i.slot===k);if(r)p.equipment[k]=r.id;}for(const m of g.MATERIALS)p.materials[m.id]=100;p.discoveredAncients=[g.ANCIENT_CATALOG.find(r=>r.slot==='armor').id];localStorage.setItem('beast-hunter:profile:v1',g.encodeProfile(p));f.src='index.html?codex-qa='+Date.now()};
</script>
